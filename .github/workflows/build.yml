# ==============================================================================
# Mutqan Hadith Build & Test CI/CD Workflow
# ==============================================================================
# Pushing a tag like v1.0.1 (release.py does this) builds a signed release APK
# and attaches it to a GitHub Release.
#
# Keystore Persistence Setup Instructions:
# To prevent "App not installed" update failures caused by signature mismatches,
# every release must be signed with the same key. Follow these 3 steps ONCE:
#
# Step 1: Generate a release keystore locally on your developer machine:
#   keytool -genkeypair -v -keystore release.keystore -alias mutqanreleasekey \
#     -keyalg RSA -keysize 2048 -validity 10000
#
# Step 2: Encode the keystore to Base64 format:
#   - Linux/macOS:
#       base64 -w 0 release.keystore > keystore_base64.txt
#   - Windows PowerShell:
#       [Convert]::ToBase64String([IO.File]::ReadAllBytes("release.keystore")) > keystore_base64.txt
#
# Step 3: Add the following Repository Secrets in GitHub:
#   GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#     - RELEASE_KEYSTORE_BASE64   : Paste content of keystore_base64.txt
#     - RELEASE_KEYSTORE_PASSWORD : the password you chose
#     - RELEASE_KEY_ALIAS         : mutqanreleasekey
#     - RELEASE_KEY_PASSWORD      : the same password again (a PKCS12 keystore, which is
#                                   what keytool creates, has one password for both)
#
# Keep release.keystore somewhere safe and out of the repository (*.keystore is
# git-ignored): losing it means future updates cannot be installed over old ones.
# Without the secrets the APK is still built, but signed with the debug key.
# ==============================================================================

name: Build & Test Mutqan Hadith

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/release.keystore
            echo "✅ Persistent release keystore successfully unpacked."
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set; refusing to publish a release signed with the debug key."
            exit 1
          else
            echo "⚠️ RELEASE_KEYSTORE_BASE64 secret is not set."
            echo "   Upload a persistent keystore to GitHub Secrets to get identical APK signatures across builds."
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK
        env:
          KEYSTORE_FILE: /home/runner/.android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::warning::The APK is signed with the debug key, not the release key."
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Refusing to publish a debug-signed release."
              exit 1
            fi
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MutqanHadith-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Mutqan Hadith ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
